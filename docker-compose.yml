# Pin the project name to jobdesk (independent of the folder name) so a folder rename is harmless
name: jobdesk

services:
  db:
    image: postgres:16-alpine
    container_name: jobdesk-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobdesk}
      POSTGRES_USER: ${POSTGRES_USER:-jobdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobdesk}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobdesk} -d ${POSTGRES_DB:-jobdesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: jobdesk-api
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://jobdesk:jobdesk@db:5432/jobdesk}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./web
    container_name: jobdesk-web
    depends_on:
      - api
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
