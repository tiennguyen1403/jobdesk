name: Task
description: A task for the coordinator to assign to an agent
labels: ["type:feat"]
body:
  - type: input
    id: milestone
    attributes:
      label: Milestone / Phase
      placeholder: "Phase 1 — Tracker MVP"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area (routes to an agent)
      options:
        - backend
        - frontend
        - db
        - ai
        - infra
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the task must achieve
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of Done
      description: Verifiable criteria (prefer "X works")
      value: |
        - [ ]
        - [ ] CI green
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Constraints / notes
      placeholder: "Keep the part-time scope; new jobs map to NormalizedJob; no auto-apply."
