name: CI

on:
  pull_request:
  push:
    branches: [main, development]

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # Throwaway Postgres for the test suite. The models use Postgres-only types
      # (JSONB, ARRAY, native ENUM), so tests need a real Postgres, not SQLite.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobdesk_test
          POSTGRES_USER: jobdesk
          POSTGRES_PASSWORD: jobdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobdesk -d jobdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Syntax check
        run: python -m compileall app
      - name: Tests
        env:
          DATABASE_URL: postgresql+psycopg://jobdesk:jobdesk@localhost:5432/jobdesk_test
        run: pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: npm install
      - name: Typecheck & build
        run: npm run build
      - name: Test
        run: npm run test
